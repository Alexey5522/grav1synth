name: Build Windows Binary

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Download and extract FFmpeg Dev
        shell: pwsh
        run: |
          $url = "https://www.gyan.dev/ffmpeg/builds/ffmpeg-release-dev.zip"
          $output = "$env:TEMP\ffmpeg.zip"
          Write-Host "Downloading FFmpeg Dev build..."
          Invoke-WebRequest -Uri $url -OutFile $output
          Write-Host "Extracting FFmpeg..."
          Expand-Archive -Path $output -DestinationPath "$env:TEMP\ffmpeg"
          $ffmpegFolder = Get-ChildItem "$env:TEMP\ffmpeg" | Where-Object { $_.PSIsContainer } | Select-Object -First 1
          
          # Указываем FFMPEG_DIR на распакованную папку, где есть include и lib
          echo "FFMPEG_DIR=$($ffmpegFolder.FullName)" >> $env:GITHUB_ENV
          echo "$($ffmpegFolder.FullName)\bin" >> $env:GITHUB_PATH

      - name: Build release binary
        run: cargo build --release

      - name: Prepare portable folder
        shell: pwsh
        run: |
          mkdir dist
          Copy-Item target\release\grav1synth.exe dist\
          
          # Копируем DLL-библиотеки FFmpeg рядом с exe для портативности
          $ffmpegBin = "$env:FFMPEG_DIR\bin"
          Copy-Item "$ffmpegBin\avcodec-*.dll" dist\
          Copy-Item "$ffmpegBin\avformat-*.dll" dist\
          Copy-Item "$ffmpegBin\avutil-*.dll" dist\
          Copy-Item "$ffmpegBin\swscale-*.dll" dist\
          Copy-Item "$ffmpegBin\swresample-*.dll" dist\

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: grav1synth-windows-portable
          path: dist/
