name: Build Windows Binary

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      # Исправлено имя экшена (BtbN/action-ffmpeg)
      - name: Set up FFmpeg
        uses: BtbN/action-ffmpeg@v5
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          arch: win64

      - name: Build release binary
        run: cargo build --release

      - name: Prepare portable folder
        shell: pwsh
        run: |
          mkdir dist
          Copy-Item target\release\grav1synth.exe dist\
          
          # Находим путь к FFmpeg и копируем нужные DLL-файлы рядом с exe
          $ffmpegPath = (Get-Command ffmpeg).Source
          $ffmpegBin = Split-Path $ffmpegPath -Parent
          
          Copy-Item "$ffmpegBin\avcodec-*.dll" dist\
          Copy-Item "$ffmpegBin\avformat-*.dll" dist\
          Copy-Item "$ffmpegBin\avutil-*.dll" dist\
          Copy-Item "$ffmpegBin\swscale-*.dll" dist\
          Copy-Item "$ffmpegBin\swresample-*.dll" dist\

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: grav1synth-windows-portable
          path: dist/
